name: c2mzeroauth

services:
  app:
    build:
      context: .
      args:
        FLAG: "${FLAG:?set FLAG in challenge/.env}"
    container_name: c2mzeroauth-app
    ports:
      - "8108:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
