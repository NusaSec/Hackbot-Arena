name: graphleak

services:
  nginx:
    build: ./nginx
    container_name: graphleak-nginx
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - ctf-net
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: graphleak-backend
    environment:
      SESSION_SECRET: "graphleak-session-33b56b9856fafadd32a0986a6bb64f96"
      FLAG: "${FLAG:?set FLAG in challenge/.env}"
      DB_PATH: "/data/talenta.db"
      AUDIT_KEY: "stg-aud-9f3b2d8c4e7a1f6d"
      NODE_ENV: "production"
    volumes:
      - graphleak-db:/data
    networks:
      - ctf-net
    restart: unless-stopped

networks:
  ctf-net:
    driver: bridge

volumes:
  graphleak-db:
    driver: local
