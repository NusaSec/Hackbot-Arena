name: graphql-batch-otp

services:
  app:
    build:
      context: .
      args:
        FLAG: "${FLAG:?set FLAG in challenge/.env}"
    container_name: graphql-batch-otp-app
    ports:
      - "8088:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
