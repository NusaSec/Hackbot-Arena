user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format ctf_log '$remote_addr - [$time_local] "$request" '
                       '$status $body_bytes_sent "$upstream_cache_status"';
    access_log /var/log/nginx/access.log ctf_log;

    sendfile        on;
    keepalive_timeout  65;

    # ============================================================
    # Cache configuration
    # ============================================================
    # NOTE: cache key is based on $request_uri only (no Cookie/Auth)
    # This is the misconfiguration that enables Web Cache Deception.
    # ============================================================
    proxy_cache_path /var/cache/nginx/ctf
                     levels=1:2
                     keys_zone=ctf_cache:10m
                     max_size=100m
                     inactive=10m
                     use_temp_path=off;

    upstream backend {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Pass real client IP and host
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ============================================================
        # Static asset caching
        # Caches anything ending in common static extensions for 5 min.
        # Cache key does NOT include the auth cookie — this is the bug.
        # ============================================================
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|map)$ {
            proxy_cache ctf_cache;
            proxy_cache_valid 200 302 5m;
            proxy_cache_valid 404 1m;
            # NOTE: $host is intentionally omitted from the cache key.
            # In production this is a bad idea (cross-vhost cache bleed),
            # but for this single-host CTF setup it ensures the bot
            # (which reaches nginx via Docker internal hostname) and
            # players (who reach it via public IP/localhost) share the
            # same cache entries.
            proxy_cache_key "$scheme$request_method$request_uri";
            proxy_cache_use_stale error timeout updating;
            proxy_ignore_headers Set-Cookie Cache-Control Expires;
            proxy_hide_header Set-Cookie;

            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key "$scheme$request_method$request_uri" always;

            proxy_pass http://backend;
        }

        # Everything else passes through, no cache
        location / {
            add_header X-Cache-Status "BYPASS" always;
            proxy_pass http://backend;
        }
    }
}
